name: SysProbe

options:
  bundleIdPrefix: com.corin
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release
  # 空目录不进工程，避免出现只用来占位的分组。
  generateEmptyDirectories: false

settings:
  base:
    # 代码里的 `nonisolated` 类型/扩展声明与 SWIFT_DEFAULT_ACTOR_ISOLATION 需要
    # Swift 6 工具链（实测需 6.2 及以上，见 .github/workflows/build.yml 的前置检查）。
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    CLANG_ENABLE_MODULES: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    # Info.plist 由 Xcode 依据 INFOPLIST_KEY_* 合成；只有构建设置表达不了的键
    # （扩展的 NSExtension 字典）才落成 Support/ 下的局部 plist。
    GENERATE_INFOPLIST_FILE: "YES"
    # 侧载用，不带任何签名身份。
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""

targets:
  SysProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      # 充电控制：守护进程的启动与看门狗（ChargeSpawn.c / ChargeControlService.swift）、
      # HTTP 桥（ChargeBridge.swift）、界面（ChargeControlView.swift）。
      #
      # `Resources` 排除掉、下面单独作为 folder 引用加进来 —— 见那一段的说明。
      - path: Sources/ChargeControl
        excludes:
          - "Resources"
          - "Resources/**"
      # 设备维护：设置页顶部的「重启设备 / 注销」。
      #
      # 这一层里**只有 Swift 侧的服务类**。真正干活的 `SysProbeRootTool` 是裸可执行
      # 文件，源码在 `Tools/RootTool.c`，由 `scripts/build-ipa.sh` 用 clang 单独编译后
      # 拷进包根 —— 它**不能**放进 Sources/：那份源码有自己的 `main()`，被 XcodeGen
      # 编进这个 target 就会和 App 的 main 撞符号，链接直接失败。
      - path: Sources/DeviceControl
      # 守护进程托管的网页界面。
      #
      # **必须是 `type: folder`（蓝色文件夹引用）**，不能让它当普通资源被展平：
      # 守护进程读的是 `NSBundle.mainBundle.bundlePath + "/www"`，也就是说
      # `SysProbe.app/www/` 这个层级本身是契约的一部分。按普通资源加进来，里面的
      # `index.html` / `css/` / `js/` 会被平铺到包根目录，`www` 这个目录名就没了，
      # 守护进程的 GET 处理器指向一个不存在的路径 —— 而它**不会报错**，
      # 只是所有静态请求 404。
      #
      # 这一层同时是 App 之外的一道保险：界面出问题时，在 Safari 里打开
      # `http://127.0.0.1:1230` 依然能手动停充（设置页里有这个地址）。
      - path: Sources/ChargeControl/Resources/www
        type: folder
    settings:
      base:
        PRODUCT_NAME: SysProbe
        PRODUCT_BUNDLE_IDENTIFIER: com.corin.sysprobe
        MARKETING_VERSION: "0.0.11"
        CURRENT_PROJECT_VERSION: "11"
        # 实测 CPU 频率的探针是 C —— Swift 没有内联汇编，而测频率靠的正是一段
        # 「周期数已知」的汇编循环。桥接头只给主 App 配：扩展的 sources 里没有
        # Shared/Hardware 这一层，用不到那个探针。
        SWIFT_OBJC_BRIDGING_HEADER: Support/SysProbe-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/Shared/Hardware
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: SysProbe
        # 启动屏的底色。`UILaunchScreen` 是个嵌套字典，构建设置表达不了，只能落成
        # 局部 plist —— 跟扩展那份 NSExtension 一样的处理。不设的话启动屏用系统背景色
        # （浅色下白、深色下黑），与画布差一截，启动会闪一下。
        #
        # 刻意**不**加 `INFOPLIST_KEY_UILaunchScreen_Generation`：实测它会多塞一个
        # 未文档化的嵌套键（`UILaunchScreen.UILaunchScreen = {}`），而 `UIColorName`
        # 本身已经是一份完整的启动屏定义。
        INFOPLIST_FILE: Support/SysProbe-Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 图标来自 Sources/App/Assets.xcassets，由 scripts/make-appicon.py 生成。
        # 不设这一项，actool 会编译整个 catalog 但不会把图标写进 Info.plist 的
        # CFBundleIcons —— 装上去就是个白方块，而且构建不会报任何错。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TodayExtension
        embed: true
        codeSign: false

  TodayExtension:
    type: app-extension
    platform: iOS
    # 只吃 Power 与 Localization：扩展不需要 Hardware 那一套（Mach / getifaddrs /
    # 内存分配），也**不再需要 Design** —— 那一层整份建立在 SwiftUI 之上。
    #
    # 这里曾经把 `Sources/Shared/Design` 链进来，好让负一屏复用主 App 的
    # `Backdrop` / `Panel` / `Metric`。代价是 appex 被拖进整个 SwiftUI 运行时
    # （实测 181 个 SwiftUI 符号），而传统 Today 扩展的内存预算与启动 watchdog
    # 撑不起它 —— 负一屏于是显示「无法载入」。
    #
    # 现在这一屏是纯 UIKit（`Sources/TodayExt/TodayWidgetView.swift`），
    # `Shared/Power` 也去掉了 `LocalizedStringKey`，整条链上再没有一处 SwiftUI。
    # CI 有断言卡住这一点，别再把 Design 加回来。
    sources:
      - path: Sources/TodayExt
      - path: Sources/Shared/Power
      - path: Sources/Shared/Localization
      # CPU / 内存 / 存储来自这一层。它里面有 **C 汇编探针**（CPU 频率靠它实测），
      # 所以扩展也得配桥接头 —— 见下面的 SWIFT_OBJC_BRIDGING_HEADER。
      #
      # 这一层里还带着 `MemoryOptimizer`（会分配大块内存的那个），它跟着一起被编进来，
      # 但只在 `run()` 被调用时才分配 —— 不调用就完全无副作用。代价只是 appex 大约
      # 大 80 KB。
      - path: Sources/Shared/Hardware
    settings:
      base:
        PRODUCT_NAME: TodayExtension
        # 换过一次：负一屏一直「无法载入」，而代码与产物都已排除，剩下的可能是
        # iOS 的扩展注册缓存（pluginkit 以 CFBundleIdentifier 为主键）。换一个主键
        # 就等于让系统把它当全新扩展注册，不依赖用户先卸载。
        PRODUCT_BUNDLE_IDENTIFIER: com.corin.sysprobe.widget
        MARKETING_VERSION: "0.0.11"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: SysProbe
        INFOPLIST_FILE: Support/TodayExtension-Info.plist
        # 扩展也要桥接头：`Shared/Hardware` 里的 CPU 频率探针是 C（Swift 没有内联汇编，
        # 而测频率靠的正是一段「周期数已知」的汇编循环）。没有它，
        # `sysprobe_measure_cpu_frequency_mhz` 找不到，编译直接失败。
        # 与主 App 用的是同一份头文件与搜索路径。
        SWIFT_OBJC_BRIDGING_HEADER: Support/SysProbe-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/Shared/Hardware
        # 让 appex **真的**链上 NotificationCenter.framework —— 这是「无法载入」的最终根因。
        #
        # 崩溃日志（`TodayExtension-*.ips`）里写得明明白白：扩展进程 trap 在
        #     +[EXConcreteExtensionContextVendor _extensionContextClass]
        # 这是 `ExtensionFoundation` 的代码，**不是我们的**。它在建立扩展的 XPC 连接时
        # 被调用（线程名 `com.apple.NSXPCListener.service.….apple-extension-service`），
        # 作用是按 `NSExtensionPointIdentifier` 找出这个扩展该用哪个
        # `NSExtensionContext` 子类 —— 对 `com.apple.widget-extension` 来说就是
        # **`NCWidgetExtensionContext`，它实现在 NotificationCenter.framework 里**。
        #
        # 而 appex 原来根本没链这个库 —— 不是被 dead-strip 掉的，是**从来就没人要求链它**：
        # `import NotificationCenter` 只在 Swift 侧做类型检查，只有真正引用到符号时才会
        # 触发 autolinking，而我们一个符号都没引用（`NCWidgetProviding` 全成员可选，
        # 实现它不需要协议元数据）。库不在 → 类找不到 → `EXC_BREAKPOINT`。
        # **这个时机早于 `NSExtensionMain` 实例化我们的 VC**，所以连 `init` 都跑不到 ——
        # 这正是「启动轨迹是空的」的原因。
        #
        # 显式写 `-framework` 就够了：ld64 的 `-dead_strip_dylibs` 默认不开（链接命令行里
        # 只有 `-dead_strip`），所以不存在「链接了又被丢掉」的问题。
        # 注意别写成 `-Wl,-no_dead_strip_dylibs` —— **ld64 没有这个选项**，会直接报
        # `ld: unknown options`。CPU-X 的 appex 链了这个库，它就能正常工作。
        OTHER_LDFLAGS: -framework NotificationCenter

schemes:
  SysProbe:
    build:
      targets:
        SysProbe: all
    run:
      config: Release
    archive:
      config: Release
