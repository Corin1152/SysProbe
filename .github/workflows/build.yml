name: Build

# 触发方式：
#   - 推送到 main / master、PR：构建并校验，产出未签名 ipa 作为 artifact
#   - 打 v* tag：额外发布一个 Release，把 ipa 挂上去
#   - 手动：Actions -> Build -> Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned ipa
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 构建号取自 commit 数，浅克隆会让每次构建号都是 1。
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      # 代码里用了 `nonisolated` 标注在类型与扩展声明上，并且依赖
      # SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor —— 这两样都要 Swift 6.2 起步
      # （Xcode 26）。工具链过旧时错误会出现在编译深处且不点名真正原因，所以先明确检查。
      - name: Check toolchain
        run: |
          required=6.2
          found=$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          echo "Swift $found (need $required or newer)"
          if [ "$(printf '%s\n%s\n' "$required" "$found" | sort -V | head -1)" != "$required" ]; then
            echo "::error::Swift $found is too old. This project needs Swift $required or newer; pin a runner image that ships it."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build unsigned ipa
        run: bash scripts/build-ipa.sh

      # 整个项目最关键的一处断言：负一屏能不能秒级刷新，全看这个扩展是不是
      # **传统** Today 扩展。它必须是 com.apple.widget-extension；如果哪天变成
      # com.apple.widgetkit-extension，界面照样能装、能显示，但刷新会掉到
      # 5 分钟以上，而且不会有任何报错 —— 所以在这里明确卡住。
      - name: Check the widget is a traditional Today extension
        run: |
          work=$(mktemp -d)
          unzip -q build/export/SysProbe-*.ipa -d "$work"
          app="$(ls -d "$work"/Payload/*.app)"
          found=0
          for appex in "$app"/PlugIns/*.appex; do
            [ -d "$appex" ] || continue
            point=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$appex/Info.plist")
            principal=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$appex/Info.plist")
            echo "appex $(basename "$appex"): $point (principal: $principal)"
            if [ "$point" != "com.apple.widget-extension" ]; then
              echo "::error::$(basename "$appex") is '$point', not 'com.apple.widget-extension'. The Today widget would fall back to WidgetKit's timeline budget and stop refreshing every second."
              exit 1
            fi
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .appex was embedded into the ipa. The Today widget would be missing entirely."
            exit 1
          fi
          rm -rf "$work"

      # 负一屏显示「无法载入」的两个坑，都是**静默**的：构建全绿、界面正常安装，
      # 只有真机上才看得出来。这里把它们卡死。
      - name: Check the widget can actually load
        run: |
          work=$(mktemp -d)
          unzip -q build/export/SysProbe-*.ipa -d "$work"
          app="$(ls -d "$work"/Payload/*.app)"
          appex="$(ls -d "$app"/PlugIns/*.appex | head -1)"
          binary="$appex/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")"

          # 在二进制里找一个字符串。
          #
          # 刻意不用 `grep -a`：它把二进制当**文本**，而文本按 `\n` 字节分行 —— 字符串池
          # 里的字面量未必恰好落在两个换行之间，会漏报（上一轮就因此误报「appex 里没有
          # sysprobe://open」）。`tr '\n' '\0'` 再 grep 也试过，`tr` 对 NUL 的处理因实现
          # 而异，不赌。`python3` 是 runner 上确定有的（本地化断言就在用），子串查找不受
          # 分行影响。
          # 必须写成**单行**：`run: |` 块里的内容会保留相对缩进，多行 Python 的第二行
          # 落到第 0 列就等于提前结束了 YAML 块，整份工作流会解析失败（试过，报了
          # "could not find expected ':'"）。
          has_string() {
            python3 -c 'import sys; sys.exit(0 if sys.argv[2].encode() in open(sys.argv[1], "rb").read() else 1)' "$1" "$2"
          }

          # 1) principal class 必须是**显式的 ObjC 名字**，不能是「模块名.类名」。
          #    后者要靠模块名在运行期被解析成类；解析不到就找不到类，负一屏「无法载入」。
          #    显式 `@objc(...)` 名字是逐字注册进 ObjC 运行时的，不依赖模块名。
          principal=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$appex/Info.plist")
          echo "NSExtensionPrincipalClass: $principal"
          case "$principal" in
            *.*)
              echo "::error::NSExtensionPrincipalClass '$principal' is module-qualified. Give the class an explicit @objc(...) name and put that bare name here."
              exit 1
              ;;
          esac
          if ! has_string "$binary" "$principal"; then
            echo "::error::'$principal' does not appear in the appex binary — the class is not exposed to the ObjC runtime, so the extension cannot be instantiated."
            exit 1
          fi

          # 2) `widgetLargestAvailableDisplayMode` 是 `NSExtensionContext` 的一个分类方法，
          #    实现在 NotificationCenter.framework 里。iOS 26 SDK 把它的声明并进了 UIKit，
          #    于是调用它只生成 objc_msgSend、**不产生任何链接依赖** —— 链接器会把那个库
          #    当「没被用到」直接 dead-strip（本工程的 appex 就是这么丢掉 Charts 的）。
          #    库不在，分类就没注册，直接调就是 unrecognized selector：扩展在 viewDidLoad
          #    里当场崩掉，负一屏显示「无法载入」。
          #    所以：只要用了这个选择器，就必须同时把框架 dlopen 进来。
          if has_string "$binary" "setWidgetLargestAvailableDisplayMode:" \
             && ! has_string "$binary" "NotificationCenter.framework"; then
            echo "::error::the appex calls setWidgetLargestAvailableDisplayMode: but never loads NotificationCenter.framework. On device the category is unregistered, so the extension crashes in viewDidLoad and the Today view shows \"Unable to Load\"."
            exit 1
          fi

          # 3) appex 里不许出现 SwiftUI 符号。这一条是「无法载入」的**真正**根因。
          #
          #    传统 Today 扩展的内存预算与启动 watchdog 都远小于主 App；appex 里只要
          #    还有 SwiftUI 的东西，dyld 就会把 SwiftUI.framework 映射进来，再叠上
          #    `UIHostingController` 那一整套视图运行时 —— 在这点预算里就是启动即被
          #    掐掉，系统显示「无法载入」。
          #
          #    判据来自对比，不是推测：能正常工作的 CPU-X，它的 appex 里 SwiftUI 符号
          #    是 **0** 个（storyboard + UIKit 控件）；我们原来是 181 个。
          #
          #    用 `nm -u` 而不是 `grep` 二进制：未定义符号不会被 strip（dyld 要靠它
          #    解析），所以这个判据在 Release 产物上依然成立。
          swiftui=$(nm -u "$binary" 2>/dev/null | grep -c '\$s7SwiftUI' || true)
          echo "SwiftUI symbols referenced by the appex: ${swiftui:-0}"
          if [ "${swiftui:-0}" -gt 0 ]; then
            echo "::error::the appex references ${swiftui} SwiftUI symbols. A traditional Today extension cannot afford the SwiftUI runtime — it gets killed at launch and the Today view shows \"Unable to Load\". Keep the widget on UIKit; see Sources/TodayExt/TodayWidgetView.swift."
            exit 1
          fi

          # 4) 点击跳转：主 App 要注册 scheme，appex 要真的构造那个 URL。
          #    缺任何一半都是**静默**失败 —— 点组件没反应，没有任何报错。
          scheme=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Info.plist" 2>/dev/null || true)
          echo "host app URL scheme: ${scheme:-<missing>}"
          if [ "$scheme" != "sysprobe" ]; then
            echo "::error::the host app does not register the 'sysprobe' URL scheme. Tapping the widget calls extensionContext.open(\"sysprobe://open\") and would fail silently."
            exit 1
          fi
          # 这里查**源码**而不是产物二进制 —— 上一轮在二进制里找它，报「找不到」，
          # 而它其实在。原因值得记下来：`sysprobe://open` 正好 15 个字符，落在 Swift
          # 的 small-string 优化上限（≤15 字节的 ASCII 字面量）内，那种字面量会被
          # 编码进指令流，**不进 `__cstring` 段**，所以 `grep` 二进制永远找不到它。
          # 对照：`SysProbeTodayViewController`（26 字符）与
          # `NotificationCenter.framework`（26 字符）都查得到，恰好都超过 15。
          #
          # 主 App 注册 scheme 那一条仍然查产物 —— 那是 plist 里的键，确定在。
          if ! grep -q "sysprobe://open" Sources/TodayExt/TodayViewController.swift; then
            echo "::error::the appex never builds the 'sysprobe://open' URL, so tapping the widget cannot open the app."
            exit 1
          fi

          # 5) appex 必须**真的链上** NotificationCenter.framework —— 这是「无法载入」的
          #    最终根因，来自真机崩溃日志：
          #
          #        +[EXConcreteExtensionContextVendor _extensionContextClass]
          #
          #    ExtensionFoundation 在建立扩展的 XPC 连接时（线程名
          #    com.apple.NSXPCListener.service.….apple-extension-service），按
          #    NSExtensionPointIdentifier 找这个扩展该用哪个 NSExtensionContext 子类 ——
          #    对 com.apple.widget-extension 就是 NCWidgetExtensionContext，它实现在
          #    NotificationCenter.framework 里。库不在，类找不到，当场 EXC_BREAKPOINT；
          #    而这个时机**早于** NSExtensionMain 实例化我们的 VC，所以连 init 都跑不到。
          #
          #    appex 原来根本没链这个库 —— 不是被 dead-strip 掉的，是**从来就没人要求链它**：
          #    `import NotificationCenter` 只在 Swift 侧做类型检查，只有真正引用到符号时
          #    才会触发 autolinking，而我们一个符号都没引用。所以 project.yml 里显式写了
          #    `-framework NotificationCenter`。这条断言保证那个配置真的生效 —— 它一旦
          #    失效，症状是「构建全绿、真机无法载入」，且**应用自己的代码一行都不会执行**，
          #    极难从代码侧看出来。
          if ! otool -L "$binary" | grep -q "NotificationCenter.framework"; then
            echo "::error::the appex does not link NotificationCenter.framework. Without it NCWidgetExtensionContext is missing, so the extension traps in +[EXConcreteExtensionContextVendor _extensionContextClass] before NSExtensionMain instantiates the view controller — the Today view shows \"Unable to Load\" and none of the app's own code runs."
            exit 1
          fi
          echo "NotificationCenter.framework is linked"

          echo "widget load checks passed"
          rm -rf "$work"

      # 图标漏掉是静默失败：构建全绿、装上去是个白方块，而且只有真机才看得出来。
      #
      # 注意别去断言 actool 吐了哪几个倍率 —— Xcode 26 / iOS 26 SDK 只输出**一张**
      # 规范化的图标 PNG（这里是 AppIcon60x60@2x.png），其余倍率由 Assets.car 提供。
      # 这是新版图标管线，不是缺陷。所以这里分两段查：
      #   1) 源 asset set 的槽位是否完整 —— 唯一由仓库控制、与 SDK 行为无关的不变量；
      #   2) 产物里的接线是否正确 —— CFBundleIconName / CFBundleIconFiles / Assets.car
      #      以及 bundle 根目录至少有一张图标 PNG。
      - name: Check the app icon is in the bundle
        run: |
          catalog="Sources/App/Assets.xcassets/AppIcon.appiconset/Contents.json"
          python3 - "$catalog" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          got = {(i["size"], i["scale"]) for i in doc["images"]}
          want = {(f"{p}x{p}", f"{s}x") for p in (20, 29, 40, 60) for s in (2, 3)}
          want.add(("1024x1024", "1x"))
          missing = sorted(want - got)
          if missing:
              print(f"::error::AppIcon.appiconset is missing {missing}")
              sys.exit(1)
          print(f"source catalog: {len(doc['images'])} slots, all present")
          PY

          work=$(mktemp -d)
          unzip -q build/export/SysProbe-*.ipa -d "$work"
          app="$(ls -d "$work"/Payload/*.app)"

          icon_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist" 2>/dev/null || echo "")
          echo "CFBundleIconName: ${icon_name:-<missing>}"
          if [ "$icon_name" != "AppIcon" ]; then
            echo "::error::CFBundleIconName is '${icon_name:-<missing>}', expected 'AppIcon'. The icon would show as a blank tile. Is ASSETCATALOG_COMPILER_APPICON_NAME set?"
            exit 1
          fi

          icon_files=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconFiles' "$app/Info.plist" 2>/dev/null || echo "")
          echo "CFBundleIconFiles: $icon_files"
          if [ -z "$icon_files" ]; then
            echo "::error::CFBundleIconFiles is empty; SpringBoard has no icon to draw."
            exit 1
          fi

          if [ ! -f "$app/Assets.car" ]; then
            echo "::error::Assets.car is missing from the app bundle. The asset catalog was not compiled in."
            exit 1
          fi
          echo "Assets.car: $(du -h "$app/Assets.car" | cut -f1)"

          echo "icon png at bundle root:"
          ls "$app"/*.png 2>/dev/null | sed 's/^/  /' || true
          if ! ls "$app"/*.png >/dev/null 2>&1; then
            echo "::error::No icon PNG at the bundle root."
            exit 1
          fi
          rm -rf "$work"

      # 本地化漏掉同样是静默失败：`.lproj` 不在包里，切语言就只有那几条直接查表的
      # 文案会变，其余 `Text("…")` 全部原地不动 —— 而且不会有任何报错。
      - name: Check the localizations are in the bundle
        run: |
          work=$(mktemp -d)
          unzip -q build/export/SysProbe-*.ipa -d "$work"
          app="$(ls -d "$work"/Payload/*.app)"

          fail=0
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            [ -d "$bundle" ] || continue
            for lang in en zh-Hans; do
              if [ ! -f "$bundle/$lang.lproj/Localizable.strings" ]; then
                echo "::error::$lang.lproj/Localizable.strings is missing from $(basename "$bundle"). SwiftUI resolves Text(\"…\") against these files, so without them the in-app language switch silently does nothing."
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] || exit 1

          # 文件在、内容是空的，同样会静默失效 —— 顺手确认中文真的在里面。
          if ! plutil -p "$app/zh-Hans.lproj/Localizable.strings" | grep -q "硬件"; then
            echo "::error::zh-Hans.lproj/Localizable.strings does not contain the expected Chinese copy."
            exit 1
          fi
          count=$(plutil -convert json -o - "$app/zh-Hans.lproj/Localizable.strings" \
                  | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "zh-Hans entries: $count"
          if [ "$count" -lt 150 ]; then
            echo "::error::only $count entries in zh-Hans.lproj; the catalog looks truncated."
            exit 1
          fi

          echo "lproj directories in the ipa:"
          find "$app" -name '*.lproj' | sed "s|$work/||" | sort | sed 's/^/  /'
          rm -rf "$work"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: SysProbe-ipa
          path: build/export/SysProbe-*.ipa
          if-no-files-found: error

      # 崩溃报告需要 dSYM 才能符号化；它不随 Release 发布，只作为构建产物保留。
      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: SysProbe-dSYM
          path: build/DerivedData/Build/Products/Release-iphoneos/*.dSYM
          if-no-files-found: warn

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/export/SysProbe-*.ipa
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            未签名构建 —— 安装前请用自己的凭证签名（巨魔 / AltStore / SideStore / Sideloadly）。
